name: Feature
description: Đề xuất hoặc triển khai một tính năng.
title: "[Feature]: "
labels: ["type:feature", "status:triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Vấn đề cần giải quyết
      description: Mô tả vấn đề của người dùng, không chỉ mô tả giải pháp.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Kết quả mong đợi
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Thành phần
      options:
        - Mobile
        - Web Admin
        - API
        - Database
        - Synchronization
        - AI
        - Infrastructure
        - Documentation
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security, tenant và offline considerations
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
